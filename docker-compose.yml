# Linux host assumed
services:
  dev: &dev
    build: { context: ., dockerfile: docker/Dockerfile }
    image: gz-multirobot-bridge:jazzy
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/home/ubuntu/gz-multirobot-bridge
      - ws_build:/home/ubuntu/ws        
    devices:
      - /dev/dri:/dev/dri               

  dev-gpu:
    <<: *dev
    profiles: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  headless:
    <<: *dev
    profiles: [headless]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    devices: []

volumes:
  ws_build:
